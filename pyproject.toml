[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-alarm"
version = "0.2.0"
description = "A Python-based alarm clock that plays music from a YouTube playlist using VLC."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [ {name = "Kristof S."} ]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "yt-dlp[default]",
    "python-vlc>=3.0",
    "mutagen",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
"Homepage" = "https://github.com/Kramer84/YoutubeAlarm"
"Bug Tracker" = "https://github.com/Kramer84/YoutubeAlarm/issues"

[project.scripts]
youtube-alarm = "youtube_alarm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
